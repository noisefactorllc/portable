<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portable Effects Viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23222'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff'>P</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 16px;
            min-width: 280px;
            max-width: 320px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        #controls h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .param-group {
            margin-bottom: 12px;
        }

        .param-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .param-name {
            font-size: 12px;
            color: #ccc;
        }

        .param-value {
            font-size: 11px;
            color: #888;
            font-family: 'SF Mono', Monaco, monospace;
        }

        .param-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #333;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .param-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .param-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .param-slider + .param-slider {
            margin-top: 4px;
        }

        .param-select {
            width: 100%;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .param-color {
            width: 100%;
            height: 24px;
            padding: 0;
            background: #333;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        .param-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #fff;
        }

        #status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            color: #888;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        #status.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
        }

        #status.success {
            color: #69db7c;
        }

        .effect-name {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .effect-description {
            font-size: 11px;
            color: #666;
            margin-bottom: 16px;
        }

        #reload-btn {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 16px;
            width: 100%;
            transition: background 0.2s;
        }

        #reload-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <h2>Effect Parameters</h2>
        <div class="effect-name" id="effect-name">Loading...</div>
        <div class="effect-description" id="effect-description"></div>
        <div id="backend-toggle" style="display:none; margin-bottom: 16px;">
            <div class="param-name" style="margin-bottom: 6px;">Backend</div>
            <label style="font-size: 12px; color: #ccc; margin-right: 12px; cursor: pointer;">
                <input type="radio" name="backend" value="glsl"> WebGL
            </label>
            <label style="font-size: 12px; color: #ccc; cursor: pointer;">
                <input type="radio" name="backend" value="wgsl"> WebGPU
            </label>
        </div>
        <div id="params"></div>
        <button id="reload-btn">↻ Reload Effect</button>
    </div>

    <div id="status">Initializing...</div>

    <script type="module">
        import { CanvasRenderer, Effect, registerStarterOps, mergeIntoEnums, extractEffectNamesFromDsl, extractEffectsFromDsl } from 'https://shaders.noisedeck.app/1/noisemaker-shaders-core.esm.js';

        // State
        let renderer = null;
        let effectDef = null;
        let paramValues = {};
        let lastModified = null;
        let hasGlsl = false;
        let hasWgsl = false;
        let currentBackend = 'glsl';
        let rendererBackend = null;
        const editedParams = new Set();
        let effectSteps = [];
        // A package remains a directory containing definition.json and shaders.
        const effectUrl = new URL(new URLSearchParams(location.search).get('effect') || '../effect/', location.href);
        if (!effectUrl.pathname.endsWith('/')) effectUrl.pathname += '/';

        let canvas = document.getElementById('canvas');
        const statusEl = document.getElementById('status');
        const paramsEl = document.getElementById('params');
        const effectNameEl = document.getElementById('effect-name');
        const effectDescEl = document.getElementById('effect-description');
        const reloadBtn = document.getElementById('reload-btn');

        // Set canvas size to match viewport
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            if (renderer) {
                renderer.resize(width, height);
            }
        }

        // Load effect definition from JSON
        async function loadEffectDefinition() {
            try {
                const response = await fetch(new URL('definition.json', effectUrl), { cache: 'no-store' });
                if (!response.ok) throw new Error('Failed to load effect definition');
                
                const newModified = response.headers.get('Last-Modified');
                const def = await response.json();
                
                // Load shader sources (try both GLSL and WGSL)
                const programs = (def.passes || []).map(p => p.program);
                def.shaders = def.shaders || {};

                for (const program of programs) {
                    def.shaders[program] = {};

                    // Try GLSL
                    try {
                        const glslResponse = await fetch(new URL(`glsl/${program}.glsl`, effectUrl), { cache: 'no-store' });
                        if (glslResponse.ok) {
                            def.shaders[program].glsl = await glslResponse.text();
                        }
                    } catch (e) { /* not available */ }

                    // Try WGSL
                    try {
                        const wgslResponse = await fetch(new URL(`wgsl/${program}.wgsl`, effectUrl), { cache: 'no-store' });
                        if (wgslResponse.ok) {
                            def.shaders[program].wgsl = await wgslResponse.text();
                        }
                    } catch (e) { /* not available */ }

                    // At least one must succeed
                    if (!def.shaders[program].glsl && !def.shaders[program].wgsl) {
                        throw new Error(`No shader found for program "${program}" (checked glsl/${program}.glsl and wgsl/${program}.wgsl)`);
                    }
                }
                
                lastModified = newModified;
                return def;
            } catch (err) {
                throw new Error(`Failed to load effect: ${err.message}`);
            }
        }

        // A type-appropriate fallback when a global omits its default
        function defaultForType(type) {
            switch (type) {
                case 'boolean': return false;
                case 'vec2': return [0, 0];
                case 'vec3':
                case 'color': return [0, 0, 0];
                case 'vec4': return [0, 0, 0, 0];
                default: return 0; // float, int
            }
        }

        // Color params carry [r, g, b] floats in 0–1; <input type="color"> wants #rrggbb
        function rgbToHex(arr) {
            const c = (x) => Math.max(0, Math.min(255, Math.round((x ?? 0) * 255)))
                .toString(16).padStart(2, '0');
            return `#${c(arr[0])}${c(arr[1])}${c(arr[2])}`;
        }

        function hexToRgb(hex) {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
            if (!m) return [0, 0, 0];
            return [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255];
        }

        function applyParamValues(values) {
            if (!renderer || effectSteps.length === 0) return;
            renderer.applyStepParameterValues(Object.fromEntries(effectSteps.map(step =>
                [`step_${step.temp}`, values])));
        }

        function setParamLive(name, value) {
            editedParams.add(name);
            applyParamValues({ [name]: value });
        }

        // Pass parameter keys to the scoped runtime API. It resolves explicit
        // uniform aliases and propagates generator volume sizes within a chain.
        function buildParamControl(name, spec, type, valueSpan) {
            // Integer enum → dropdown
            if (type === 'int' && spec.choices && typeof spec.choices === 'object') {
                const select = document.createElement('select');
                select.className = 'param-select';
                const labelFor = (v) =>
                    Object.keys(spec.choices).find(k => spec.choices[k] === v) ?? String(v);
                // If the default isn't one of the choices, fall back to the first
                // so the control, the readout, and the uniform stay in agreement.
                const choiceValues = Object.values(spec.choices);
                if (!choiceValues.includes(paramValues[name])) {
                    paramValues[name] = choiceValues[0];
                }
                for (const [choiceLabel, val] of Object.entries(spec.choices)) {
                    const opt = document.createElement('option');
                    opt.value = String(val);
                    opt.textContent = choiceLabel;
                    if (val === paramValues[name]) opt.selected = true;
                    select.appendChild(opt);
                }
                valueSpan.textContent = labelFor(paramValues[name]);
                select.addEventListener('change', (e) => {
                    const val = parseInt(e.target.value, 10);
                    paramValues[name] = val;
                    valueSpan.textContent = labelFor(val);
                    setParamLive(name, val);
                });
                return select;
            }

            // Boolean → checkbox
            if (type === 'boolean') {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'param-checkbox';
                checkbox.checked = !!paramValues[name];
                valueSpan.textContent = String(checkbox.checked);
                checkbox.addEventListener('change', (e) => {
                    const val = e.target.checked;
                    paramValues[name] = val;
                    valueSpan.textContent = String(val);
                    setParamLive(name, val);
                });
                return checkbox;
            }

            // Color → color picker
            if (type === 'color') {
                if (!Array.isArray(paramValues[name])) paramValues[name] = defaultForType('color');
                const picker = document.createElement('input');
                picker.type = 'color';
                picker.className = 'param-color';
                picker.value = rgbToHex(paramValues[name]);
                valueSpan.textContent = picker.value;
                picker.addEventListener('input', (e) => {
                    const rgb = hexToRgb(e.target.value);
                    paramValues[name] = rgb;
                    valueSpan.textContent = e.target.value;
                    setParamLive(name, rgb);
                });
                return picker;
            }

            // Vectors → one slider per component. vec4 is handled defensively for
            // robustness only; the op layer registers it as a color arg and it is
            // not a documented user-facing parameter type.
            if (type === 'vec2' || type === 'vec3' || type === 'vec4') {
                const count = type === 'vec2' ? 2 : (type === 'vec3' ? 3 : 4);
                if (!Array.isArray(paramValues[name])) paramValues[name] = defaultForType(type);
                const min = spec.min ?? 0;
                const max = spec.max ?? 1;
                const step = spec.step ?? 0.01;
                const fmt = () =>
                    '(' + paramValues[name].map(v => Number(v).toFixed(2)).join(', ') + ')';
                valueSpan.textContent = fmt();

                const container = document.createElement('div');
                for (let i = 0; i < count; i++) {
                    const slider = document.createElement('input');
                    slider.type = 'range';
                    slider.className = 'param-slider';
                    slider.min = min;
                    slider.max = max;
                    slider.step = step;
                    slider.value = paramValues[name][i] ?? 0;
                    slider.addEventListener('input', (e) => {
                        paramValues[name][i] = parseFloat(e.target.value);
                        valueSpan.textContent = fmt();
                        setParamLive(name, paramValues[name].slice());
                    });
                    container.appendChild(slider);
                }
                return container;
            }

            // Default: float / int → single slider
            const isInt = type === 'int';
            const fmt = (v) => isInt ? String(Math.round(v)) : Number(v).toFixed(2);
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.className = 'param-slider';
            slider.min = spec.min ?? 0;
            slider.max = spec.max ?? (isInt ? 100 : 1);
            slider.step = spec.step ?? (isInt ? 1 : 0.01);
            slider.value = paramValues[name];
            slider.dataset.param = name;
            valueSpan.textContent = fmt(paramValues[name]);
            slider.addEventListener('input', (e) => {
                const val = isInt ? parseInt(e.target.value, 10) : parseFloat(e.target.value);
                paramValues[name] = val;
                valueSpan.textContent = fmt(val);
                setParamLive(name, val);
            });
            return slider;
        }

        // Build and render param controls
        function renderParamControls(def) {
            effectNameEl.textContent = `user.${def.func}`;
            effectDescEl.textContent = def.description || '';

            paramsEl.innerHTML = '';
            const globals = def.globals || {};

            for (const [name, spec] of Object.entries(globals)) {
                if (spec.ui?.control === false) continue;
                const type = spec.type || 'float';

                // Initialize value if not set (preserves values across hot reloads).
                // Clone array defaults so editing a control never mutates the
                // parsed definition object.
                if (paramValues[name] === undefined) {
                    const initial = spec.default !== undefined ? spec.default : defaultForType(type);
                    paramValues[name] = Array.isArray(initial) ? initial.slice() : initial;
                }

                const group = document.createElement('div');
                group.className = 'param-group';

                const label = document.createElement('div');
                label.className = 'param-label';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'param-name';
                nameSpan.textContent = name;

                const valueSpan = document.createElement('span');
                valueSpan.className = 'param-value';

                label.appendChild(nameSpan);
                label.appendChild(valueSpan);
                group.appendChild(label);

                const control = buildParamControl(name, spec, type, valueSpan);
                if (control) group.appendChild(control);

                paramsEl.appendChild(group);
            }
        }

        let backendsInitialized = false;

        function detectBackends(def) {
            const programs = (def.passes || []).map(pass => def.shaders?.[pass.program]);
            hasGlsl = programs.length > 0 && programs.every(program => program?.glsl);
            hasWgsl = programs.length > 0 && programs.every(program => program?.wgsl);
            if (!hasGlsl && !hasWgsl) throw new Error('Every pass must have a shader for at least one shared backend (GLSL or WGSL).');

            const toggle = document.getElementById('backend-toggle');
            if (hasGlsl && hasWgsl) {
                toggle.style.display = '';
                // Only set default on first load; preserve user choice on hot-reload
                if (!backendsInitialized) {
                    currentBackend = 'glsl';
                    backendsInitialized = true;
                }
            } else {
                toggle.style.display = 'none';
                currentBackend = hasWgsl ? 'wgsl' : 'glsl';
            }

            const radios = document.querySelectorAll('input[name="backend"]');
            radios.forEach(r => { r.checked = r.value === currentBackend; });
        }

        // Compile and run effect
        async function compileAndRun() {
            try {
                effectSteps = [];
                effectDef = await loadEffectDefinition();
                detectBackends(effectDef);
                if (!renderer || rendererBackend !== currentBackend) await initRenderer();

                const namespace = 'user';
                const name = effectDef.func;
                const opName = `${namespace}.${name}`;
                
                const globals = effectDef.globals || {};
                const pipelineInputs = new Set(['inputTex', 'inputTex3d', 'inputGeo']);
                const needsInput = (effectDef.passes || []).some(pass => Object.values(pass.inputs || {}).some(input => pipelineInputs.has(input)));
                const isStarter = effectDef.starter ?? !needsInput;
                
                // Create effect instance
                const instance = new Effect({
                    name: effectDef.name,
                    namespace: namespace,
                    func: name,
                    description: effectDef.description,
                    tags: effectDef.tags || [],
                    globals: globals,
                    passes: effectDef.passes || [],
                    textures: effectDef.textures || {},
                    outputTex3d: effectDef.outputTex3d,
                    outputGeo: effectDef.outputGeo,
                    uniformLayout: effectDef.uniformLayout,
                    uniformLayouts: effectDef.uniformLayouts,
                    paramAliases: effectDef.paramAliases,
                    defaultProgram: effectDef.defaultProgram
                });
                instance.shaders = effectDef.shaders || {};
                instance.starter = isStarter;
                
                // Use the same op, alias, and choice registration as consumer apps.
                const choices = renderer.registerEffectWithRuntime({ namespace, name, instance });
                await mergeIntoEnums(choices);
                if (isStarter) registerStarterOps([opName]);
                
                renderParamControls(effectDef);
                
                // Build DSL with required search directive
                let dsl = effectDef.defaultProgram;
                if (!dsl) {
                    if (!isStarter) throw new Error('A portable filter or volume renderer needs a defaultProgram with its input chain.');
                    const renderVolume = effectDef.outputTex3d ? '.render3d()' : '';
                    dsl = `search user, render\n${effectDef.func}()${renderVolume}.write(o0)\nrender(o0)`;
                }
                const manifest = { ...renderer.manifest, [`user/${name}`]: { starter: isStarter } };
                const builtinEffects = [...new Set(extractEffectNamesFromDsl(dsl, manifest)
                    .map(effect => effect.effectId)
                    .filter(id => !id.startsWith('user/')))];
                await renderer.loadEffects(builtinEffects);
                
                // Compile - throws on error
                await renderer.compile(dsl);

                // The program (including upstream volumeSize inheritance) owns
                // initial values. Only replay controls the user actually edited.
                effectSteps = extractEffectsFromDsl(dsl).filter(effect => effect.effectKey === opName);
                const step = effectSteps[0];
                const pass = step && renderer.pipeline.graph.passes.find(pass => pass.id.startsWith(`node_${step.temp}_`));
                for (const [key, spec] of Object.entries(globals)) {
                    const uniform = spec.uniform || key;
                    if (!editedParams.has(key) && pass?.uniforms?.[uniform] !== undefined) {
                        paramValues[key] = pass.uniforms[uniform];
                    }
                }
                renderParamControls(effectDef);

                // Replay edits only on this package's steps; built-in effects
                // keep their own values even when uniform names overlap.
                applyParamValues(Object.fromEntries(Object.entries(paramValues)
                    .filter(([name]) => editedParams.has(name))));
                
                renderer.start();
                setStatus(`Loaded: user.${effectDef.func} (${currentBackend === 'wgsl' ? 'WebGPU' : 'WebGL'})`, 'success');
            } catch (err) {
                let errorMsg = 'Unknown error';
                if (err && typeof err === 'object') {
                    if (err.diagnostics && Array.isArray(err.diagnostics)) {
                        errorMsg = err.diagnostics.map(d => d.message || JSON.stringify(d)).join('; ');
                    } else if (err.message) {
                        errorMsg = err.message;
                    } else {
                        errorMsg = JSON.stringify(err);
                    }
                } else {
                    errorMsg = String(err);
                }
                setStatus(errorMsg, 'error');
                console.error('Effect load error:', errorMsg);
            }
        }

        // Hot reload check
        async function checkForChanges() {
            try {
                const response = await fetch(new URL('definition.json', effectUrl), {
                    method: 'HEAD',
                    cache: 'no-store' 
                });
                const newModified = response.headers.get('Last-Modified');
                
                if (lastModified && newModified !== lastModified) {
                    setStatus('Changes detected, reloading...', 'success');
                    await compileAndRun();
                }
            } catch (err) {
                // Ignore polling errors
            }
        }

        // Set status message
        function setStatus(message, type = '') {
            statusEl.textContent = message;
            statusEl.className = type;
        }

        async function initRenderer() {
            if (renderer) {
                renderer.stop();
                await renderer.dispose();
            }
            // Replace canvas — a canvas can only hold one context type (WebGL or WebGPU)
            const oldCanvas = canvas;
            const newCanvas = document.createElement('canvas');
            newCanvas.id = 'canvas';
            newCanvas.style.width = oldCanvas.style.width;
            newCanvas.style.height = oldCanvas.style.height;
            newCanvas.width = oldCanvas.width;
            newCanvas.height = oldCanvas.height;
            oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);
            canvas = newCanvas;

            renderer = new CanvasRenderer({
                canvas,
                width: canvas.width,
                height: canvas.height,
                basePath: 'https://shaders.noisedeck.app/1',
                bundlePath: 'https://shaders.noisedeck.app/1/effects',
                preferWebGPU: currentBackend === 'wgsl',
                useBundles: true
            });
            await renderer.loadManifest();
            rendererBackend = currentBackend;
        }

        // Initialize
        async function init() {
            try {
                setStatus('Initializing renderer...');

                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                setStatus('Loading effect...');

                await compileAndRun();

                // Expose globals for MCP browser harness
                // Use defineProperty so renderer reference stays current after backend switching
                Object.defineProperty(window, '__portableCanvasRenderer', {
                    get: () => renderer,
                    configurable: true
                });
                // Use defineProperty so pipeline is always fresh
                Object.defineProperty(window, '__portableRenderingPipeline', {
                    get: () => renderer.pipeline,
                    configurable: true
                });
                window.__portableCurrentBackend = () => {
                    const backendName = renderer.pipeline?.backend?.getName?.() || '';
                    return backendName.toLowerCase().includes('webgpu') ? 'wgsl' : 'glsl';
                };
                window.__portableSetPaused = (paused) => {
                    if (paused) {
                        renderer.stop();
                    } else {
                        renderer.start();
                    }
                };
                window.__portableSetPausedTime = (time) => {
                    renderer.render(time);
                };
                // Expose frame count for MCP harness frame tracking
                Object.defineProperty(window, '__portableFrameCount', {
                    get: () => renderer.pipeline?.frameIndex ?? 0,
                    configurable: true
                });

                // Backend toggle event listeners
                document.querySelectorAll('input[name="backend"]').forEach(radio => {
                    radio.addEventListener('change', async (e) => {
                        currentBackend = e.target.value;
                        setStatus('Switching backend...');
                        await compileAndRun();
                    });
                });

                // Start hot reload polling
                setInterval(checkForChanges, 1000);

            } catch (err) {
                setStatus(`Init failed: ${err.message}`, 'error');
                console.error(err);
            }
        }

        // Reload button
        reloadBtn.addEventListener('click', () => {
            setStatus('Reloading...');
            compileAndRun();
        });

        init();
    </script>
</body>
</html>
